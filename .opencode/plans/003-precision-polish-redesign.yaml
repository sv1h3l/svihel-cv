        - "components/JBorderTop.tsx"
      key_changes:
        JButton:
          - "baseClassName: přidat leading-none k flex containeru."
          - "content span: zachovat flex items-center justify-center w-full h-full + přidat leading-none a pt-[0.5px] (mikro kompenzace fontu dolu)."
          - "lang varianta: stejná kompenzace pt-[0.5px] — CS/EN text přesně centrovaný."
          - "Beze změny: satén, border-white/[0.08], inset 1px highlight, focus ring, silkSpring 260/30, whileTap 0.97."
        JBorderTop:
          - "ODSTRANIT matný bod (size-1 rounded-full uprostřed)."
          - "Nový gradient: h-px bg-gradient-to-r from-neutral-800/80 via-neutral-800/30 to-transparent."
          - "Motion scaleX 0→1 + opacity na silkSpring zachovat; pozice absolute -top-px zachovat."
      verification:
        - "grep -n 'rounded-full' components/JBorderTop.tsx → 0 výskytů"
        - "grep -n 'from-neutral-800/80' components/JBorderTop.tsx → 1 výskyt"
        - "grep -n 'leading-none' components/JButton.tsx → 2 a více výskytů"
        - "grep -nF 'pt-[0.5px]' components/JButton.tsx → 1 a více výskytů"
        - "npx tsc --noEmit"

