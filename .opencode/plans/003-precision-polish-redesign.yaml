# ==============================================================================
#  EXEKUČNÍ PLÁN: Precision & Optical Polish (design-systémová preciznost)
#  Soubor: .opencode/plans/003-precision-polish-redesign.yaml
#  Vytvořeno: 2026-10-31
#  Předchůdce: 002-luxury-minimal-redesign.yaml (DONE)
# ==============================================================================

plan:
  id: "003-precision-polish-redesign"
  title: "Precision & Optical Polish — optické centrování, rytmika, akademická restrukturalizace, Linear/Stripe standard"
  target_aesthetic: "Perfektní optické centrování každého glyphu, nepřerušované vlasové linky, taktilní satén, nula kaskádových hoverů, typografická sebejistota design systému Linear/Stripe."
  driver: "Uživatelské zadání 14 bodů precision-polish nad výstupem plánu 002."

  # ---------------------------------------------------------------------------
  # ANALÝZA SOUČASNÉHO STAVU (vstupy do plánu, nalezené deficity)
  # ---------------------------------------------------------------------------
  analyza_soucasneho_stavu:
    JButton:
      - "Base satén OK; CHYBÍ leading-none na content span a mikro kompenzace font metrik (text sedí opticky níže)."
      - "content span má flex items-center justify-center w-full h-full, ale bez leading-none — CS/EN a ikony padají pod střed."
      - "smaller size-8 rounded-lg; default size-10 rounded-xl — dualita zůstává tokenem (akce projektů přejdou na default)."
    JTab:
      - "Header: flex items-center gap-4; index text-[11px]; divider h-4 w-px bg-neutral-800; h3 bez leading-none — osa není matematicky centrována."
      - "Padding p-5 sm:p-7 lg:p-8 vs. požadovaná škála p-4 sm:p-7 lg:p-8; mt-6 jednotná pro všechny taby."
      - "section má class group; top hairline group-hover:via-white/[0.1]; nutný audit, že vnitřní group-hover (JButton/contacts) nebinduje na tuto skupinu."
    JList:
      - "Job panel: full-width pruh rounded-xl border p-3 s en-dash a labelem Role/Position — redundance (oba odstranit)."
      - "Header badge: identický neutrální styl pro Company i Project; komponenta má k dispozici prop company pro diferenciaci."
      - "Odrážky: dash má mt-0.5 + leading-relaxed — padá pod optický první řádek."
      - "Children wrapper: rounded-2xl border p-1 + whileHover y -1 — společný panel kolem tlačítek (odstranit)."
      - "Rytmika: firstCard mt-1 / ostatní mt-9 / mb-9 — nekonzistentní."
    JGrid:
      - "Certifikáty: samostatný JButton (size-7, ExternalLink stroke 1.8) vedle status badge — nahradit hybridním badgem [ STATUS | akce ]."
      - "Levý sloupec má md:justify-end, ale externí tlačítko rozhazuje osu; po integraci čisté md:justify-end text-end."
      - "Badges a chips bez leading-none (vertikální asymetrie)."
    JBorderTop:
      - "Matný bod size-1 rounded-full uprostřed — odstranit; gradient from-transparent via-neutral-700/40 nahradit dle tokenu."
    pages_index:
      - "Hero pořadí: dostupnost-kapsle → h1 → pozice → CZ/REMOTE; požadováno h1 → pozice → metadata řádek."
      - "Lomítko / před pozicí není opticky centrováno — padá pod střed verzálek."
      - "Dostupnost: statický šedý bod bez pulsu; požadován emerald whisper + jemná opacity pulzace + jemný podklad."
      - "Divider PORTFOLIO: my-10 sm:my-14 — asymetrie; požadováno my-16 sm:my-20 lg:my-24."
      - "Ikony: strokeWidth 1.8 napříč (Phone/Mail/ArrowUpRight/FileText/brand svg/gallery) — požadováno 1.5 až 1.6."
      - "Akademická sféra: 2 bloky (diplomaThesis, bachelorThesis) bez institucí — požadována restrukturalizace podle vzoru komerční sféry."
    JFullSizeImageButton:
      - "className override hover:border-amber-500/50 + group-hover:text-amber-300 — starý amber hover; nahradit neutrálem."
    data:
      - "personalPageProjectsDataCZ/EN má 7 entit; akademické teze jsou samostatné bloky; CHYBÍ univerzita, gymnázium, maturitní práce."
      - "Kontrakt ProjectsData: header, label, company, job (volitelné), firstCard, values."

  # ---------------------------------------------------------------------------
  # GLOBÁLNÍ HARD-CONSTRAINTS (porušení = FAIL)
  # ---------------------------------------------------------------------------
  constraints:
    build_safety:
      - "package.json build spouští firebase deploy → NIKDY npm run build; verifikace vždy npx next build."
      - "Po každém kroku musí projít npx tsc --noEmit."
    data_contract_003:
      - "Změny dat POVOLENY POUZE v akademické sféře (krok 6): úprava header/label/firstCard u diplomaThesis a bachelorThesis + NOVÉ entity universityPalacky, gymnasiumNovyJicin, maturitaThesis (placeholder)."
      - "Všechny ostatní entity (komerční sféra, generalData JSON) zůstávají bit-per-bit nedotčené."
      - "Kontrakt ProjectsData zachován: každá entita má header, label, company, firstCard, values; job nesmí přibýt tam, kde nebyl."
      - "Values stávajících tezí (diplomaThesis, bachelorThesis) zůstávají beze změny textu."
    prop_contract_003:
      - "JButton: API beze změny."
      - "JTab: API beze změny."
      - "JList: NOVÁ OPTIONAL prop nested?: boolean (vnořené akademické projekty); prop isCzech zůstává v rozhraní (kompatibilita call-sites), ale v renderu se přestane používat (Role/Position mizí)."
      - "JGrid: API beze změny (gridArray: GridRow[]); certifikátová akce integrována do renderu badge přes tertiaryValue."
      - "JFullSizeImage / JFullSizeImageButton: API beze změny; galerie plně funkční (ESC, šipky, scroll-lock, portál)."
    motion_standard:
      - "silkSpring { type: spring, stiffness: 260, damping: 30 } — jediná UI pružina; galerijní spring 350/25 v JFullSizeImage je modální výjimka (zachována)."
      - "Puls dostupnosti: framer-motion opacity loop [0.35, 1, 0.35], duration 2.6, repeat Infinity, ease easeInOut — ŽÁDNÝ animate-ping, ŽÁDNÝ scale."
    typography:
      - "leading-none na všech mono mikro-labely a badge; kompenzace pt-[0.5px] / pt-[1px] dle fontu."
      - "Badge Company vs Project: jemná diferenciace (viz design_tokens.badges)."
      - "En-dash odrážky: leading-none + mt-[0.35rem] (optický první řádek)."
    hover_isolation:
      - "Hover karty JTab smí změnit POUZE border karty (neutral-800/75 → neutral-700/70) a top hairline (via-white/[0.06] → via-white/[0.1])."
      - "Žádné vnitřní group-hover nesmí nabindovat na group karty; interaktivní prvky si nesou vlastní group."

  # ---------------------------------------------------------------------------
  # DESIGN TOKENS 003 (rozšiřují tokeny 002)
  # ---------------------------------------------------------------------------
  design_tokens:
    spacing:
      card_padding: "p-4 sm:p-7 lg:p-8 (JTab karty); hero showcase p-6 sm:p-8 lg:p-10 (záměrná hierarchie)"
      section_gap: "mt-6 sm:mt-8 mezi JTab sekcemi"
      list_rhythm: "firstCard mt-0; ostatní mt-8 sm:mt-10; mb-9; lastCard mb-2; nested mt-6"
      divider_portfolio: "my-16 sm:my-20 lg:my-24"
      action_gap: "gap-2 sm:gap-2.5 mezi samostatnými JButton akcemi"
    hero:
      order: "h1 → pozice (h2) → metadata řádek (CZ/REMOTE + dostupnost)"
      slash: "inline-flex items-center justify-center leading-none select-none text-neutral-500 size-4 mr-2"
      availability: "text: font-mono text-[10px] tracking-widest uppercase text-neutral-400/70; bod: size-1.5 rounded-full bg-emerald-400/80 + halo blur-[2px] bg-emerald-400/15"
      meta_row: "font-mono text-[10px] uppercase tracking-[0.2em] text-neutral-500"
    badges:
      company_label: "border-neutral-700/50 bg-neutral-800/40 text-neutral-300/90"
      project_label: "border-neutral-800/60 bg-neutral-900/60 text-neutral-500"
      role_capsule: "inline-flex items-center gap-2 rounded-lg border border-amber-500/15 bg-amber-500/[0.05] px-2.5 py-1 font-mono text-[11px] tracking-wide text-amber-200/70 leading-none pt-[1px]"
      hybrid_badge: "[ STATUS | akce ] — status + w-px h-3 dělič v barvě stavu + inline SVG šipka v jednom containeru; hover povyšuje container"
    dividers:
      hairline_plain: "h-px bg-gradient-to-r from-neutral-800/80 via-neutral-800/30 to-transparent — BEZ bodu, BEZ přerušení"
      tab_header_divider: "my-5 h-px bg-gradient-to-r from-neutral-800/60 via-neutral-800/25 to-transparent (zachováno)"
    iconography:
      stroke_lucide: "strokeWidth 1.5 (všechny lucide ikony UI)"
      stroke_brand_svg: "strokeWidth 1.6 (inline brand LinkedIn, GitHub)"
      optical_box: "size-3.5 v badge/řádku; size-4 v samostatných akcích"
    focus:
      ring: "focus-visible:ring-2 focus-visible:ring-amber-400/40 (přístupnost, beze změny)"

  # ---------------------------------------------------------------------------
  # LOGICKÉ FÁZE (seskupení kroků, stavy [PENDING])
  # ---------------------------------------------------------------------------
  faze:
    - id: "A"
      nazev: "Preciznost základů — font metrika, vlasové linky, osa hlavičky"
      kroky: [1, 2]
      status: DONE
    - id: "B"
      nazev: "Obsahové komponenty — JList role/badges/akce, JGrid hybridní certifikáty"
      kroky: [3, 4]
      status: DONE
    - id: "C"
      nazev: "Hero hierarchie, akademická restrukturalizace dat, ikonografický standard"
      kroky: [5, 6, 7]
      status: DONE
    - id: "D"
      nazev: "Finální gate — types, lint, build, vizuální checklist"
      kroky: [8]
      status: DONE

  # ---------------------------------------------------------------------------
  # KROKY (atomické, exekuovat sekvenčně 1→8, všechny [PENDING])
  # ---------------------------------------------------------------------------
  steps:
    - id: 1
      title: "JButton.tsx — optické centrování obsahu; JBorderTop.tsx — čistá vlasová linka bez bodu"
      status: DONE
      depends_on: []
      files:
