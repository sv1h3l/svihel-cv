          - "mt-6 → mt-6 sm:mt-8 (rytmus sekcí); lastTab mb-10 lg:mb-16 zůstává."
        hover_isolation:
          - "group na sekci ponechat POUZE pro vlastní top hairline (group-hover:via-white/[0.1]) a border hovery."
          - "Audit: žádné další group-hover uvnitř renderu; vnitřní komponenty reagují jen na vlastní direct hover."
        dividers:
          - "Header divider my-5 s gradientem via-neutral-800/25 zůstává nepřerušený."
      verification:
        - "grep -n 'gap-3' components/JTab.tsx → 1 výskyt v headeru"
        - "grep -n 'h-3.5' components/JTab.tsx → 1 výskyt (dělník)"
        - "grep -nF 'p-4 sm:p-7 lg:p-8' components/JTab.tsx → 1 výskyt"
        - "grep -nF 'mt-6 sm:mt-8' components/JTab.tsx → 1 výskyt"
        - "grep -n 'group-hover' components/JTab.tsx → výskyt POUZE na top hairline spanu"
        - "npx tsc --noEmit"

    - id: 3
      title: "JList.tsx — role jako saténová kapsle, diferenciace Company/Project, optické odrážky, volné akce"
      status: DONE
      depends_on: [1]
