# =============================================================================
# PLÁN 004 — VISUAL BALANCE & TYPOGRAPHIC PRECISION
# Principal Design Systems Architect & Creative Director
# =============================================================================
# Cíl: Absolutní optická harmonie — vertikální centrování odznaků, proporce
#       hero headeru, čistá hierarchie komerční i akademické sféry, seniorní
#       typografická škála, unifikovaná akční ikonografie.
#
# VSTUPNÍ BASELINE (stav po plánu 003):
#   - JButton: base size-10 rounded-xl (default) / size-8 rounded-lg (smaller),
#     content span leading-none pt-[0.5px]
#   - JTab h3: text-lg sm:text-xl md:text-2xl; header divider nesymetrický
#   - JBorderTop: gradient from-neutral-800/80 via-neutral-800/30 to-transparent
#   - JGrid badge: px-2.5 py-1 pt-[1px]; arrow size-3.5; primaryValue sm:text-base
#   - JList: company token bg-neutral-800/40; project token bg-neutral-900/60;
#     h4 company text-2xl sm:text-3xl / project text-xl sm:text-2xl;
#     values sm:text-[15px]; "nested" prop (ml-10 + border-l) — akademie
#   - Hero: foto vlevo, availability kapsle → h1 → h2 se lomítkem → metadata row
#   - Kontakty: vnitřní icon boxy (size-8 rounded-lg border) + border-t splitter
#   - Jazyk: JButton lang, !px-3 !py-1.5 rounded-xl text-[11px]
#
# ROZHODNUTÍ DESIGN DIRECTORA:
#   - Tailwind spacing nemá 6.5/8.5 → arbitrary: h-6 sm:h-[26px], size-8 sm:size-[34px]
#   - smaller prop v JButton se RUŠÍ; jediná akční metrika pro celé repo
#   - nested prop v JList se RUŠÍ úplně; akademie = identický flat rytmus jako
#     komerční sféra (vazba instituce → práce nese badge taxonomie + pořadí)
#   - Pozice FULL-STACK DEVELOPER = statický text (žádný swap, žádné lomítko)
#   - JSON data public/data jsou v 004 ZMRAŽENA (bit-per-bit, žádná změna)
#
# FÁZE: A) metrika tlačítek + vlasové linky
#       B) badge systém + typografická škála komponent
#       C) hero harmonie, přepínač, kontakty, akademie
#       D) finální gate
# =============================================================================

