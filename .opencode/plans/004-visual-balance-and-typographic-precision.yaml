risks:
  - risk: "!size-auto override na lang tlačítku může rozbít JButton base metriku"
    mitigation: "Krok 6 mění POUZE lang tlačítko; kroky 1+7 stejným číslem [34px]/8 sjednotí zbytek; screenshot ověření v kroku 8."
  - risk: "Zrušení nested propu změní vizuální rytmus akademie bez indentace"
    mitigation: "Badge taxonomie Company/Project + pořadí vytváří vazbu; borderTop u gymnázia odděluje 2. instituci; kroky 5+7 atomicky + grep nested = 0."
  - risk: "Hromadná změna velikostí písma rozbije řádkování karet"
    mitigation: "leading relace ponechány (leading-none u os, leading-relaxed u body); minimální výšky AnimatePresence bloků (about) zůstávají."
  - risk: "Zmrazení dat ohroženo nedbalým editorem"
    mitigation: "Krok 8 ověřuje git diff public/data = prázdný; data nejsou v files žádného kroku."
  - risk: "Dev server FOUC artefakt (data-next-hide-fouc)"
    mitigation: "Známý dev-only jev; vizuální verifikace vždy z produkčního out/ exportu."

