  - "Badge 3 úrovní: Company bg-neutral-800/60, Position amber bg-amber-500/[0.06] border-amber-500/20, Project border-white/[0.08] bg-neutral-900/40."
  - "Akční tlačítka projektů: identická size-8 sm:size-[34px] rounded-lg, ikony size-4, strokeWidth 1.5/1.6."
  - "Akademie: bez levé linky, flat rytmus identický komerční sféře; vazba instituce → práce čitelná."
