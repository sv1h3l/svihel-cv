  - "public/data/*.json zůstávají v plánu 004 ZMRAŽENA — žádná hodnota, klíč ani řádek se nemění."
  - "Žádné nové JSON entity; akademie po 003 (universityPalacky, gymnasiumNovyJicin, maturitaThesis) zůstává."

design_decisions:
  - "Tailwind nemá spacing 6.5/8.5 (config extend obsahuje jen '22') → h-6 sm:h-[26px] a size-8 sm:size-[34px]."
  - "Fixní h-6 u badge: inline-flex items-center justify-center leading-none + pt-[0.5px] kompenzace metrik bezpatkového fontu."
  - "JButton: zrušit smaller; všechny akce identické size-8 sm:size-[34px] rounded-lg; lang tlačítko kompaktní přes className override (!size-auto h-6)."
  - "JList: zrušit nested (border-l i indent); akademie tvoří stejný plochý rytmus jako komerční sféra."
  - "Pozice v hero: statický text FULL-STACK DEVELOPER oběma jazyky; animaci swapu si ponechává pouze text dostupnosti v statusové pilulce."
  - "silkSpring 260/30 a galerijní spring 350/25 (modální výjimka) zůstávají beze změny."

